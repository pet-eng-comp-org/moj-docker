name: CI

# Constrói as imagens, testa a stack de ponta a ponta e publica no GHCR. Na main, o job implanta
# grava o digest do que mudou no docker-compose.yml; quem acompanha esse arquivo (o Portainer do
# PET) aplica. As versões (1.2.3) saem do versiona.yml.
# Atualizar o MOJ = mover os submódulos de vendor/ para o commit novo do upstream num PR.
on:
  push:
    branches: [main, development]
    paths:
      - 'vendor/**'
      - 'imagens/**'
      - 'docker-bake.hcl'
      - 'docker-compose*.yml'
      - 'tests/e2e/**'
      - '.github/workflows/publica-imagem.yml'
      - '.github/workflows/teste-e2e.yml'
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.servico }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # cada imagem com a base dela (docker-bake.hcl), publicada junto
          - servico: server
            alvos: server-base,server
          - servico: web
            alvos: web
          - servico: judge
            alvos: sysroot,judge
    env:
      # pull request só constrói: quem vem de fork ou do Dependabot não pode publicar
      PUBLICA: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # O Portainer recusa clonar repositório com symlink, e a stack para de
      # implantar sem aviso. Por isso o .dockerignore do vendor é cópia, não link.
      - name: Sem symlink e .dockerignore igual ao do cdmoj
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" {print $4}')
          [ -z "$links" ] || { echo "::error::symlink no repositório: $links"; exit 1; }
          cmp vendor/.dockerignore vendor/cdmoj/deploy/.containerignore \
            || { echo "::error::copie vendor/cdmoj/deploy/.containerignore para vendor/.dockerignore"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - if: env.PUBLICA == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/bake-action@v7
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          TAGS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('sha-{0}', github.sha) }}
          CACHE: gha
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.alvos }}
          push: ${{ env.PUBLICA }}

      - if: env.PUBLICA == 'true'
        env:
          METADADOS: ${{ steps.build.outputs.metadata }}
        run: |
          echo "$METADADOS" | jq -r 'to_entries[] | "Digest publicado (\(.key)): \(.value["containerimage.digest"])"' \
            >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: build
    uses: ./.github/workflows/teste-e2e.yml
    with:
      # em pull request as imagens não foram publicadas: o teste as reconstrói do cache
      tag: ${{ github.event_name == 'pull_request' && 'local' || format('sha-{0}', github.sha) }}
      publicadas: ${{ github.event_name != 'pull_request' }}

  # Publicar não é implantar: quem implanta é o commit abaixo, que grava o digest novo no
  # docker-compose.yml. Só troca o serviço cujos arquivos mudaram desde o commit que está em
  # produção (o :sha- anotado no compose). Esse commit é o registro do deploy: git revert nele
  # volta a versão anterior. O push feito com GITHUB_TOKEN não dispara este workflow de novo.
  implanta:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: implanta
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Grava o digest no compose
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARQ=docker-compose.yml
          # Execução antiga não implanta por cima de uma mais nova. Só conta commit que
          # dispara este workflow (os mesmos caminhos do on.push.paths), filtrado pelo
          # assunto; o awk lê tudo porque, com pipefail, sair cedo mataria o git log.
          novo=$(git log --format='%H%x09%s' "${GITHUB_SHA}..HEAD" -- vendor imagens \
                   docker-bake.hcl 'docker-compose*.yml' tests/e2e .github/workflows/publica-imagem.yml \
                   .github/workflows/teste-e2e.yml \
                 | awk -F'\t' '!f && $2 !~ /^deploy:/ {print $1; f=1}')
          if [ -n "$novo" ]; then
            echo "Há commit mais novo ($novo); a execução dele implanta."; exit 0
          fi

          mudou=""
          for servico in server web judge; do
            case $servico in
              server) arquivos='^(vendor/cdmoj$|vendor/mojtools$|imagens/server/)' ;;
              web)    arquivos='^(vendor/cdmoj$|imagens/web/)' ;;
              judge)  arquivos='^(vendor/cdjudge$|vendor/mojtools$|imagens/judge/)' ;;
            esac
            img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}/${servico}"
            # Compara com o commit que está EM PRODUÇÃO, não com o push anterior: deploy
            # que falhou ou foi cancelado entra na próxima execução em vez de se perder.
            ultimo=$(grep -oE "${img}:sha-[0-9a-f]+" "$ARQ" | head -1 | sed 's/.*:sha-//' || true)
            if [ "$EVENTO" = push ] && [ -n "$ultimo" ] && git cat-file -e "${ultimo}^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$ultimo" "$GITHUB_SHA" | grep -qE "$arquivos"; then
                continue
              fi
            fi
            digest=$(docker buildx imagetools inspect "${img}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            # Digest vazio apagaria a imagem do compose e derrubaria o serviço.
            if ! echo "$digest" | grep -qxE 'sha256:[0-9a-f]{64}'; then
              echo "Digest inválido para ${img}: '${digest}'"; exit 1
            fi
            sed -i -E "s#(image: ${img})(:sha-[0-9a-f]+)?@sha256:[0-9a-f]+#\1:sha-${GITHUB_SHA}@${digest}#" "$ARQ"
            # Linha que não casou (imagem renomeada, dono novo) não pode passar em verde.
            if ! grep -qF "${img}:sha-${GITHUB_SHA}@${digest}" "$ARQ"; then
              echo "A linha image: de ${img} não foi encontrada no compose"; exit 1
            fi
            mudou="$mudou $servico"
          done

          if git diff --quiet -- "$ARQ"; then
            echo "Nada a implantar: nenhum serviço mudou desde o que está em produção."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "deploy:$mudou no commit ${GITHUB_SHA:0:8}

          O Portainer aplica em até 1 minuto. Para voltar: git revert deste commit." -- "$ARQ"
          # Merge que entrou entre o checkout e o push: rebase e tenta de novo.
          for _ in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            sleep 5; git pull -q --rebase origin main
          done
          echo "O push do commit de deploy falhou 3 vezes"; exit 1
