name: Versiona as imagens

# Ao publicar um release no GitHub (tag X.Y.Z num commit da main): as imagens que estão em
# produção nesse commit ganham as tags X.Y.Z, X.Y e latest, e os composes vão anexados ao
# release (é deles que o "Início rápido" do README baixa).
on:
  release:
    types: [published]

jobs:
  # Versão = as imagens que estão em produção no commit da tag (as do docker-compose.yml), com
  # a tag da versão e "latest". Não reconstrói nada: o release é exatamente o que foi testado.
  versiona:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Põe a versão nas imagens
        env:
          VERSAO: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}"
          echo "$VERSAO" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "Versão fora do padrão X.Y.Z: $VERSAO"; exit 1; }
          menor="${VERSAO%.*}"
          # imagem final e a base dela saem do mesmo build, com a mesma tag sha-
          for par in server:server-base web: judge:sysroot; do
            servico="${par%%:*}"; base="${par#*:}"
            sha=$(grep -oE "${img}/${servico}:sha-[0-9a-f]+" docker-compose.yml | head -1 | sed 's/.*:sha-//')
            [ -n "$sha" ] || { echo "O docker-compose.yml não tem a imagem de ${servico}"; exit 1; }
            for nome in "$servico" ${base:+"$base"}; do
              docker buildx imagetools create \
                -t "${img}/${nome}:${VERSAO}" -t "${img}/${nome}:${menor}" -t "${img}/${nome}:latest" \
                "${img}/${nome}:sha-${sha}"
              echo "${nome}:${VERSAO} = sha-${sha}" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Anexa os composes ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$VERSAO" docker-compose.yml docker-compose.local.yml \
            docker-compose.traefik.yml --clobber
